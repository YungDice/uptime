name: Release

# Builds the Windows installers - Uptime_Installer.exe and Uptime_Installer.msi -
# signs them for the updater, and publishes them as a GitHub release together
# with latest.json, the feed installed copies poll.
#
# To ship a version:
#   npm run release          # tests, bumps package.json, tags vX.Y.Z, pushes
#
# One-time setup is in README.md, under "Releasing the desktop app".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (optional)
        required: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  # The release is published into this repo with the workflow's own token.
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # This repo, by default: it is public, so its release downloads are too.
      # To publish somewhere else - a public repo, if this one is ever made
      # private - set the RELEASES_REPO variable, add a RELEASES_TOKEN secret
      # that can write to it, and point plugins.updater.endpoints in
      # src-tauri/tauri.conf.json at it.
      RELEASES_REPO: ${{ vars.RELEASES_REPO || github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the one-time setup
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
          SAME_REPO: ${{ (vars.RELEASES_REPO || github.repository) == github.repository }}
        run: |
          missing=0
          [ -n "$KEY" ] || { echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY secret - see README.md, Releasing the desktop app."; missing=1; }
          [ -n "$PASSWORD" ] || { echo "::error::Add the TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret - see README.md, Releasing the desktop app."; missing=1; }
          if [ "$SAME_REPO" != "true" ] && [ -z "$TOKEN" ]; then
            echo "::error::RELEASES_REPO is $RELEASES_REPO, so a RELEASES_TOKEN secret that can write to it is needed."
            missing=1
          fi
          exit $missing

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($expected). Bump with 'npm version' so the two cannot disagree."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - run: npm test

      - name: Build and sign
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Without these the release runs on browser storage, like a fresh
          # checkout does. The anon key is public by design, so a variable is
          # fine; a secret works too.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri -- build --bundles nsis,msi --config src-tauri/tauri.release.conf.json

      - name: Stage the installers and latest.json
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/stage-release.mjs

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if gh release view "v$version" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::v$version is already published in $RELEASES_REPO. Bump the version to ship again."
            exit 1
          fi

          notes="$NOTES"
          if [ -z "$notes" ]; then
            notes="$(printf '%s\n' \
              "Uptime $version for Windows." \
              "" \
              "- **Uptime_Installer.exe** - the one to download." \
              "- **Uptime_Installer.msi** - the same app as a Windows Installer package." \
              "" \
              "Already installed? It updates itself: Account > App > Updates.")"
          fi

          # A tag pushed by npm run release already exists here; a manual run
          # tags the commit it built. Publishing elsewhere, the tag is created
          # there instead.
          target=()
          if [ "$RELEASES_REPO" = "$GITHUB_REPOSITORY" ]; then target=(--target "$GITHUB_SHA"); fi

          # Marked latest, so releases/latest/download/* - the download links
          # and the updater's feed - move to this build together.
          gh release create "v$version" \
            release/Uptime_Installer.exe release/Uptime_Installer.msi release/latest.json \
            --repo "$RELEASES_REPO" \
            "${target[@]}" \
            --title "Uptime $version" \
            --notes "$notes" \
            --latest
          echo "Published https://github.com/$RELEASES_REPO/releases/tag/v$version"

      - uses: actions/upload-artifact@v4
        with:
          name: uptime-${{ github.run_number }}-windows
          path: release/

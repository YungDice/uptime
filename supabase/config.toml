project_id = "uptime"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:1420"
additional_redirect_urls = ["http://localhost:1420"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

# Anonymous sign-in keeps the first run frictionless - an account exists from
# the first tap so a streak can start, and can be upgraded to email later.
[auth.email]
enable_signup = true

# Branded emails (same files go into the hosted dashboard: Auth > Emails).
# Anonymous users upgrade via updateUser({ email }), which sends email_change.
[auth.email.template.confirmation]
subject = "Confirm your email"
content_path = "./supabase/templates/confirm-signup.html"

[auth.email.template.email_change]
subject = "Confirm your email"
content_path = "./supabase/templates/change-email.html"

[auth.email.template.invite]
subject = "You're invited to Uptime"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your Uptime sign-in link"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.recovery]
subject = "Reset your Uptime password"
content_path = "./supabase/templates/reset-password.html"

[auth.email.template.reauthentication]
subject = "Your Uptime verification code"
content_path = "./supabase/templates/reauthentication.html"

[functions.sweep-lapsed]
verify_jwt = false

# Stripe calls this with no Supabase session to send. The request is checked
# against STRIPE_WEBHOOK_SECRET instead - see the function's header.
[functions.stripe-webhook]
verify_jwt = false
